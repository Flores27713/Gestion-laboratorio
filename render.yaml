services:
  - type: web
    name: gestion-laboratorio
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-lab-db
          property: connectionString

databases:
  - name: gestion-lab-db
    plan: free
    databaseName: gestion_laboratorio
